<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR工作台 — 新人知识库 & 成长对标</title>
<style>
/* ===== Reset & Variables ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #3370FF;
  --primary-light: #E1EAFF;
  --primary-hover: #2860DF;
  --success: #00B578;
  --success-light: #E8F8F2;
  --warning: #FF8F1F;
  --warning-light: #FFF3E6;
  --danger: #F54A45;
  --danger-light: #FFF0F0;
  --text-primary: #1F2329;
  --text-secondary: #646A73;
  --text-tertiary: #8F959E;
  --bg-body: #F5F6F7;
  --bg-white: #FFFFFF;
  --border: #E5E6EB;
  --border-light: #F0F1F4;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --sidebar-w: 268px;
  --toc-w: 200px;
  --header-h: 56px;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg-body);
  color: var(--text-primary);
  line-height: 1.6;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ===== Header ===== */
.header {
  height: var(--header-h);
  background: var(--bg-white);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  flex-shrink: 0;
  z-index: 100;
}
.header-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  margin-right: 32px;
  white-space: nowrap;
}
.header-logo img { height: 30px; vertical-align: middle; }
.header-nav { display: flex; gap: 4px; flex: 1; }
.header-nav button {
  padding: 7px 20px;
  border: none;
  background: transparent;
  border-radius: 20px;
  font-size: 14px;
  cursor: pointer;
  color: var(--text-secondary);
  transition: var(--transition);
  font-weight: 500;
}
.header-nav button:hover { background: var(--bg-body); color: var(--text-primary); }
.header-nav button.active {
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 600;
}
.header-actions { display: flex; align-items: center; gap: 8px; }
.header-actions .avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #3370FF, #8B5CF6);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
}

/* ===== Layout ===== */
.app-body { display: flex; flex: 1; overflow: hidden; }

/* ===== Sidebar ===== */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-white);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}
.sidebar-header {
  padding: 16px 16px 12px;
  font-size: 12px;
  color: var(--text-tertiary);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sidebar-header .add-btn {
  width: 24px; height: 24px;
  border-radius: 4px;
  border: none;
  background: transparent;
  cursor: pointer;
  color: var(--text-tertiary);
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.sidebar-header .add-btn:hover { background: var(--bg-body); color: var(--text-primary); }
.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0 8px 16px;
}
.sidebar-scroll::-webkit-scrollbar { width: 4px; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Tree */
.tree-folder { margin-bottom: 2px; }
.tree-folder-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  transition: var(--transition);
  user-select: none;
}
.tree-folder-header:hover { background: var(--bg-body); }
.tree-folder-header .arrow {
  width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s;
  font-size: 10px;
  color: var(--text-tertiary);
  flex-shrink: 0;
}
.tree-folder-header .arrow.open { transform: rotate(90deg); }
.tree-folder-header .folder-icon { font-size: 15px; flex-shrink: 0; }
.tree-folder-header .folder-name { flex: 1; }
.tree-folder-header .folder-count {
  font-size: 11px;
  color: var(--text-tertiary);
  background: var(--bg-body);
  padding: 1px 6px;
  border-radius: 10px;
}
.tree-children { overflow: hidden; transition: max-height 0.3s ease; }
.tree-children.collapsed { max-height: 0 !important; }
.tree-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px 7px 38px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  transition: all 0.15s ease;
  user-select: none;
  position: relative;
}
.tree-item::before {
  content: '';
  position: absolute;
  left: 0; top: 4px; bottom: 4px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: transparent;
  transition: background 0.15s ease;
}
.tree-item:hover { background: var(--bg-body); color: var(--text-primary); }
.tree-item:hover::before { background: var(--border); }
.tree-item.active {
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 600;
}
.tree-item.active::before { background: var(--primary); }
.tree-item .doc-icon { font-size: 15px; flex-shrink: 0; opacity: 0.7; }
.tree-item.active .doc-icon { opacity: 1; }

/* ===== Main Content ===== */
.content-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0;
}
.content-scroll::-webkit-scrollbar { width: 6px; }
.content-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Breadcrumb */
.breadcrumb {
  padding: 12px 28px;
  font-size: 13px;
  color: var(--text-tertiary);
  display: flex;
  align-items: center;
  gap: 6px;
}
.breadcrumb span { color: var(--text-secondary); }
.breadcrumb .sep { color: var(--text-tertiary); }

/* Document container */
.doc-container {
  max-width: 820px;
  margin: 0 auto;
  padding: 0 40px 80px;
}
.doc-title {
  font-size: 28px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
  line-height: 1.3;
}
.doc-meta {
  font-size: 13px;
  color: var(--text-tertiary);
  margin-bottom: 32px;
  display: flex;
  gap: 16px;
}
.doc-body { font-size: 15px; color: var(--text-primary); line-height: 1.8; }
.doc-body h2 {
  font-size: 20px;
  font-weight: 600;
  margin: 36px 0 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-light);
}
.doc-body h3 { font-size: 17px; font-weight: 600; margin: 28px 0 10px; }
.doc-body p { margin-bottom: 14px; }
.doc-body ul, .doc-body ol { margin-bottom: 14px; padding-left: 22px; }
.doc-body li { margin-bottom: 6px; }
.doc-body code {
  background: var(--bg-body);
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 13px;
  color: var(--danger);
}

/* Cards in doc */
.info-card {
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 20px 24px;
  margin: 20px 0;
  box-shadow: var(--shadow-sm);
}
.info-card.tip {
  border-left: 4px solid var(--primary);
  background: var(--primary-light);
  border-color: transparent;
}
.info-card.warn {
  border-left: 4px solid var(--warning);
  background: #FFF9F2;
  border-color: transparent;
}
.info-card .card-label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.info-card.tip .card-label { color: var(--primary); }
.info-card.warn .card-label { color: var(--warning); }

/* Checklist */
.checklist { list-style: none; padding: 0; }
.checklist li {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border-light);
}
.checklist li:last-child { border-bottom: none; }
.checklist .check {
  width: 20px; height: 20px;
  border-radius: 4px;
  border: 2px solid var(--border);
  flex-shrink: 0;
  margin-top: 2px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
  font-size: 11px;
  color: transparent;
}
.checklist .check.done {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
}

/* ===== Growth View (目标感 / 成长对标) ===== */
.growth-container {
  max-width: 920px;
  margin: 0 auto;
  padding: 0 40px 80px;
}

/* Onboarding progress banner */
.progress-banner {
  background: linear-gradient(135deg, #3370FF 0%, #5B8DEF 100%);
  border-radius: var(--radius-lg);
  padding: 28px 32px;
  color: #fff;
  margin-bottom: 28px;
  box-shadow: var(--shadow-md);
}
.progress-banner .banner-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.progress-banner .banner-greeting { font-size: 22px; font-weight: 700; }
.progress-banner .banner-badge {
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
}
.progress-banner .banner-days {
  font-size: 48px;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 4px;
}
.progress-banner .banner-subtitle { font-size: 14px; opacity: 0.85; margin-bottom: 14px; }
.progress-banner .banner-bar-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-banner .banner-bar {
  flex: 1;
  height: 8px;
  background: rgba(255,255,255,0.25);
  border-radius: 4px;
  overflow: hidden;
}
.progress-banner .banner-bar-fill {
  height: 100%;
  background: #fff;
  border-radius: 4px;
  transition: width 1.2s ease;
}
.progress-banner .banner-bar-label { font-size: 13px; font-weight: 600; white-space: nowrap; }
.progress-banner .banner-milestones {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 11px;
  opacity: 0.7;
}

/* Gap alert strip */
.gap-alert {
  background: var(--bg-white);
  border: 1px solid var(--warning);
  border-left: 4px solid var(--warning);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  margin-bottom: 28px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  font-size: 14px;
  color: var(--text-primary);
}
.gap-alert .alert-icon { font-size: 20px; flex-shrink: 0; }
.gap-alert strong { color: var(--danger); }

/* Section title */
.section-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.section-desc {
  font-size: 13px;
  color: var(--text-tertiary);
  margin-bottom: 16px;
}

/* Milestone compare cards */
.milestone-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 32px;
}
.ms-card {
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
}
.ms-card:hover { box-shadow: var(--shadow-md); }
.ms-card .ms-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.ms-card .ms-day {
  font-size: 24px;
  font-weight: 800;
  color: var(--text-primary);
}
.ms-card .ms-status {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 12px;
}
.ms-card .ms-status.done { background: var(--success-light); color: var(--success); }
.ms-card .ms-status.active { background: var(--primary-light); color: var(--primary); }
.ms-card .ms-status.upcoming { background: var(--bg-body); color: var(--text-tertiary); }
.ms-card .ms-list { list-style: none; padding: 0; }
.ms-card .ms-list li {
  font-size: 13px;
  color: var(--text-secondary);
  padding: 6px 0;
  border-bottom: 1px solid var(--border-light);
  display: flex; align-items: center; gap: 8px;
}
.ms-card .ms-list li:last-child { border-bottom: none; }
.ms-card .ms-list .ms-icon { font-size: 14px; flex-shrink: 0; }

/* Competency gap chart */
.competency-section {
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  margin-bottom: 32px;
  box-shadow: var(--shadow-sm);
}
.comp-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border-light);
}
.comp-row:last-child { border-bottom: none; }
.comp-label {
  width: 90px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  flex-shrink: 0;
}
.comp-bars {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.comp-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-tertiary);
}
.comp-bar-row .bar-label { width: 48px; flex-shrink: 0; text-align: right; }
.comp-bar-track {
  flex: 1;
  height: 18px;
  background: var(--bg-body);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}
.comp-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 1s ease;
  display: flex;
  align-items: center;
  padding-left: 8px;
  font-size: 10px;
  font-weight: 700;
  color: #fff;
}
.comp-bar-fill.current { background: var(--primary); opacity: 0.7; }
.comp-bar-fill.expected { background: var(--border); color: var(--text-tertiary); }
.comp-gap-tag {
  font-size: 11px;
  font-weight: 600;
  width: 56px;
  flex-shrink: 0;
  text-align: left;
}
.comp-gap-tag.big { color: var(--danger); }
.comp-gap-tag.medium { color: var(--warning); }
.comp-gap-tag.small { color: var(--success); }

/* Growth timeline */
.timeline-section {
  margin-bottom: 32px;
}
.timeline {
  position: relative;
  padding-left: 28px;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 8px;
  top: 4px;
  bottom: 4px;
  width: 2px;
  background: var(--border);
}
.tl-node {
  position: relative;
  margin-bottom: 20px;
  padding: 14px 18px;
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
}
.tl-node::before {
  content: '';
  position: absolute;
  left: -24px;
  top: 18px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--primary);
  border: 2px solid #fff;
  box-shadow: 0 0 0 2px var(--primary);
}
.tl-node.past::before { background: var(--success); box-shadow: 0 0 0 2px var(--success); }
.tl-node.current::before { background: var(--primary); box-shadow: 0 0 0 2px var(--primary); animation: pulse 2s infinite; }
.tl-node.future::before { background: var(--text-tertiary); box-shadow: 0 0 0 2px var(--text-tertiary); }
.tl-node .tl-time {
  font-size: 12px;
  color: var(--text-tertiary);
  font-weight: 600;
  margin-bottom: 4px;
}
.tl-node .tl-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
.tl-node .tl-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
.tl-node .tl-action {
  display: inline-block;
  margin-top: 8px;
  font-size: 12px;
  color: var(--primary);
  font-weight: 600;
  cursor: pointer;
}
.tl-node .tl-action:hover { text-decoration: underline; }

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 2px var(--primary); }
  50% { box-shadow: 0 0 0 6px rgba(51,112,255,0.2); }
}

/* Warning signals area */
.warning-signals {
  background: var(--danger-light);
  border: 1px solid #FCC;
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  margin-bottom: 32px;
}
.warning-signals h3 { color: var(--danger); font-size: 15px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.signal-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #FDD;
  font-size: 13px;
  color: var(--text-primary);
}
.signal-item:last-child { border-bottom: none; }
.signal-item .signal-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-top: 5px;
  flex-shrink: 0;
}
.signal-dot.red { background: var(--danger); }
.signal-dot.yellow { background: var(--warning); }
/* Warning update flash */
.warning-signals.flash {
  animation: warningFlash 0.6s ease;
}
@keyframes warningFlash {
  0% { box-shadow: 0 0 0 0 rgba(245,74,69,0.5); background: #fff; }
  50% { box-shadow: 0 0 0 8px rgba(245,74,69,0); background: #fff; }
  100% { box-shadow: 0 0 0 0 transparent; }
}

/* ===== Interactive Rating Panel ===== */
.rating-panel { margin-bottom: 32px; }
.rating-row {
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px 22px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
}
.rating-row:hover { box-shadow: var(--shadow-md); }
.rating-row .rr-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  flex-wrap: wrap;
  gap: 8px;
}
.rr-name { font-size: 15px; font-weight: 600; color: var(--text-primary); }
.rr-scores {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
}
.rr-current { font-weight: 700; color: var(--primary); font-size: 18px; }
.rr-sep { color: var(--text-tertiary); }
.rr-expected { color: var(--text-tertiary); font-weight: 500; }
.rr-gap {
  font-size: 12px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 12px;
  margin-left: 4px;
}
.rr-gap.big { background: var(--danger-light); color: var(--danger); }
.rr-gap.medium { background: var(--warning-light); color: var(--warning); }
.rr-gap.small { background: var(--success-light); color: var(--success); }
/* Custom range slider */
.rr-slider-wrap { position: relative; margin-bottom: 2px; padding: 0 2px; }
.rr-slider-wrap input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 8px;
  border-radius: 4px;
  background: var(--border-light);
  outline: none;
  cursor: pointer;
}
.rr-slider-wrap input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--primary);
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: pointer;
  transition: box-shadow 0.15s;
}
.rr-slider-wrap input[type="range"]::-webkit-slider-thumb:hover {
  box-shadow: 0 2px 14px rgba(51,112,255,0.35);
}
.rr-ticks {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--text-tertiary);
  padding: 0 2px;
  margin-bottom: 2px;
}
.rr-ticks span { cursor: pointer; transition: color 0.15s; text-align: center; width: 40px; }
.rr-ticks span:hover { color: var(--primary); }
.rr-ticks span.active { color: var(--primary); font-weight: 700; }
/* Anchor toggle */
.anchor-toggle-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  color: var(--text-tertiary);
  transition: var(--transition);
  white-space: nowrap;
}
.anchor-toggle-btn:hover { background: var(--bg-body); color: var(--text-primary); }
.anchor-toggle-btn.open { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
.anchor-detail {
  background: #fafbfc;
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-top: 4px;
  margin-bottom: 12px;
  font-size: 12px;
  border: 1px solid var(--border-light);
  display: none;
}
.anchor-detail.show { display: block; }
.anchor-detail .ad-title { font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
.anchor-level {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 2px 0;
  color: var(--text-secondary);
}
.anchor-level .al-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 3px;
  background: var(--bg-body);
  color: var(--text-tertiary);
  width: 36px;
  text-align: center;
  flex-shrink: 0;
}
.anchor-level.current { color: var(--primary); font-weight: 600; }
.anchor-level.current .al-badge { background: var(--primary-light); color: var(--primary); }
/* Score summary */
.score-summary {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  margin-bottom: 28px;
}
.summary-card {
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 22px 24px;
  box-shadow: var(--shadow-sm);
  text-align: center;
  transition: var(--transition);
}
.summary-card.sc-hard { border-top: 3px solid var(--primary); }
.summary-card.sc-soft { border-top: 3px solid #8B5CF6; }
.summary-card.sc-total { border-top: 3px solid var(--success); }
.sc-label { font-size: 12px; color: var(--text-tertiary); font-weight: 600; margin-bottom: 8px; }
.sc-value {
  font-size: 36px;
  font-weight: 800;
  line-height: 1;
  transition: color 0.3s;
}
.sc-value.hard-color { color: var(--primary); }
.sc-value.soft-color { color: #8B5CF6; }
.sc-value.total-color { color: var(--success); }
.sc-detail { font-size: 11px; color: var(--text-tertiary); margin-top: 6px; }
/* Hard metrics */
.hard-metrics { margin-bottom: 28px; }
.hard-metrics .section-title-sm {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.metric-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  font-size: 14px;
}
.metric-row .metric-name { color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
.metric-row .metric-val { font-weight: 600; font-size: 14px; }
.metric-toggle { display: flex; gap: 4px; }
.metric-toggle button {
  padding: 4px 12px;
  border: 1px solid var(--border);
  background: var(--bg-white);
  border-radius: 14px;
  font-size: 12px;
  cursor: pointer;
  transition: var(--transition);
  color: var(--text-secondary);
}
.metric-toggle button:hover { background: var(--bg-body); }
.metric-toggle button.active-yes {
  background: var(--success);
  color: #fff;
  border-color: var(--success);
}
.metric-toggle button.active-no {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
}
/* Milestone checkbox */
.ms-check {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px; height: 18px;
  border-radius: 4px;
  border: 2px solid var(--border);
  cursor: pointer;
  transition: var(--transition);
  font-size: 10px;
  color: transparent;
  flex-shrink: 0;
}
.ms-check.checked {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
}
.ms-check.ms-partial {
  background: var(--warning-light);
  border-color: var(--warning);
  color: var(--warning);
}
@media (max-width: 768px) {
  .score-summary { grid-template-columns: 1fr; }
}

/* ===== Animations ===== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-in { animation: fadeInUp 0.4s ease forwards; opacity: 0; }
.delay-1 { animation-delay: 0.05s; }
.delay-2 { animation-delay: 0.1s; }
.delay-3 { animation-delay: 0.15s; }
.delay-4 { animation-delay: 0.2s; }
.delay-5 { animation-delay: 0.25s; }

/* ===== View Toggle ===== */
.view { display: none; }
.view.active { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

/* ===== Search ===== */
.search-box { position: relative; margin-right: 8px; display: flex; align-items: center; }
.search-box input {
  width: 200px;
  padding: 7px 34px 7px 34px;
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 13px;
  outline: none;
  background: var(--bg-body);
  transition: all 0.25s ease;
  color: var(--text-primary);
}
.search-box input::placeholder { color: var(--text-tertiary); }
.search-box input:focus {
  width: 260px;
  background: var(--bg-white);
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(51,112,255,0.1);
}
.search-box .search-icon {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  color: var(--text-tertiary);
  pointer-events: none;
  z-index: 1;
}
.search-clear {
  position: absolute;
  right: 6px; top: 50%;
  transform: translateY(-50%);
  width: 22px; height: 22px;
  border-radius: 50%;
  border: none;
  background: var(--border);
  color: var(--text-secondary);
  font-size: 11px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  z-index: 1;
}
.search-clear:hover { background: var(--text-tertiary); color: #fff; }
.search-no-results {
  padding: 40px 20px;
  text-align: center;
  color: var(--text-tertiary);
}
.no-results-icon { font-size: 36px; margin-bottom: 10px; }
.no-results-text { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.no-results-hint { font-size: 12px; }
/* Search highlight */
.search-highlight { background: #FFE08A; border-radius: 2px; padding: 0 2px; }

/* ===== TOC ===== */
.toc-sidebar {
  width: var(--toc-w);
  background: transparent;
  flex-shrink: 0;
  padding: 40px 12px 0 0;
  display: none;
}
.toc-sidebar.show { display: block; }
.toc-title {
  font-size: 12px;
  color: var(--text-tertiary);
  font-weight: 600;
  margin-bottom: 10px;
}
.toc-item {
  display: block;
  padding: 4px 8px;
  font-size: 12px;
  color: var(--text-tertiary);
  cursor: pointer;
  border-radius: 4px;
  transition: var(--transition);
  text-decoration: none;
  border-left: 2px solid transparent;
}
.toc-item:hover { color: var(--text-secondary); }
.toc-item.active {
  color: var(--primary);
  border-left-color: var(--primary);
  background: var(--primary-light);
}

/* Growth sidebar mini info */
.growth-sidebar-info {
  padding: 12px 16px;
}
.gs-stat {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--border-light);
  font-size: 13px;
}
.gs-stat:last-child { border-bottom: none; }
.gs-stat .gs-val { font-weight: 600; }
.gs-stat .gs-val.good { color: var(--success); }
.gs-stat .gs-val.warn { color: var(--warning); }

/* ===== Responsive ===== */
@media (max-width: 1200px) {
  .toc-sidebar { display: none !important; }
  .milestone-grid { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .sidebar { display: none; }
  .milestone-grid { grid-template-columns: 1fr; }
  .doc-container, .growth-container { padding: 0 16px 40px; }
  .progress-banner .banner-days { font-size: 32px; }
}
</style>
</head>

<h2>场景一：走进办公室，我该找谁？</h2>
<p>你到公司后第一件事不是开电脑，而是<strong>找到你的 Buddy</strong>。每期新人都会有一位 Buddy（通常是同部门的前辈），Ta 会带你认识工位和周边设施，带你见团队同事，帮你确认电脑、账号、权限是否都已就绪。</p>

<h2>场景二：一堆系统账号，先搞定哪个？</h2>

<h2>考勤规则</h2><p>公司实行弹性工作制，核心工作时间为 <strong>10:00-17:00</strong>，其余时间可自由安排。</p>
<ul><li>打卡方式：企业微信自动打卡（进入公司 WiFi 范围自动记录）</li><li>迟到处理：每月累计迟到30分钟内不扣薪，超出部分按分钟计算</li><li>加班：需提前在系统中申请，经上级审批后方可计入调休</li></ul>

<h3>产品线概览</h3><ul><li><strong>A 产品（核心）：</strong>面向中大型企业的 SaaS 解决方案，客单价高、决策链长</li><li><strong>B 产品（增长）：</strong>面向中小企业的标准化产品，订阅制、自助化</li><li><strong>C 产品（探索）：</strong>基于 AI 的新产品，尚在 PMF 验证阶段</li></ul>

<h2>关键术语表</h2><table style="width:100%;border-collapse:collapse;margin:16px 0;font-size:14px;"><tr style="background:var(--bg-body);"><th style="padding:8px 12px;text-align:left;border:1px solid var(--border);">术语</th><th style="padding:8px 12px;text-align:left;border:1px solid var(--border);">含义</th></tr><tr><td style="padding:8px 12px;border:1px solid var(--border);">ARR</td><td style="padding:8px 12px;border:1px solid var(--border);">年度经常性收入</td></tr><tr><td style="padding:8px 12px;border:1px solid var(--border);">NDR</td><td style="padding:8px 12px;border:1px solid var(--border);">净收入留存率</td></tr><tr><td style="padding:8px 12px;border:1px solid var(--border);">PMF</td><td style="padding:8px 12px;border:1px solid var(--border);">产品-市场匹配</td></tr></table>`,

        content: `
<h2>招聘标准流程（2026版）</h2><p>涵盖从需求发起到候选人入职的全链路。</p>
<h3>第一步：需求确认</h3><ul><li>用人部门提交「招聘需求表」→ HR 确认 JD 合理性</li><li>明确：必须条件 vs 加分条件，薪资范围，到岗时间</li><li><strong>红线：</strong>JD 中不得出现性别、年龄、地域等歧视性描述</li></ul>
<h3>第二步：渠道发布</h3><ol><li>内部推荐（优先渠道，入职留存率最高）</li><li>主流招聘平台（BOSS直聘/猎聘/脉脉）</li><li>垂直社区 / 社群</li><li>猎头（仅限高管/稀缺岗位）</li></ol>

function renderTree() {
  treeScroll.innerHTML = '';
  knowledgeBase.forEach(folder => {
    const folderDiv = document.createElement('div');
    folderDiv.className = 'tree-folder';
    const childCount = folder.children.length;
    const isOpen = folder.children.some(c => c.id === activeDocId) || folder.id === 'folder-1';
    folderDiv.innerHTML = '<div class="tree-folder-header" data-folder="' + folder.id + '"><span class="arrow ' + (isOpen ? 'open' : '') + '">▶</span><span class="folder-icon">' + folder.icon + '</span><span class="folder-name">' + folder.name + '</span><span class="folder-count">' + childCount + '</span></div><div class="tree-children ' + (isOpen ? '' : 'collapsed') + '" data-folder-children="' + folder.id + '" style="max-height:' + (isOpen ? childCount * 38 + 'px' : '0') + '">' + folder.children.map(doc => '<div class="tree-item ' + (doc.id === activeDocId ? 'active' : '') + '" data-doc="' + doc.id + '"><span class="doc-icon">' + doc.icon + '</span>' + doc.name + '</div>').join('') + '</div>';
    treeScroll.appendChild(folderDiv);
  });
  document.querySelectorAll('.tree-folder-header').forEach(h => h.addEventListener('click', function() { toggleFolder(h.dataset.folder); }));
  document.querySelectorAll('.tree-item').forEach(item => item.addEventListener('click', function() { loadDoc(item.dataset.doc); }));
}

function toggleFolder(folderId) {
  var header = document.querySelector('[data-folder="' + folderId + '"]');
  var children = document.querySelector('[data-folder-children="' + folderId + '"]');
  var arrow = header.querySelector('.arrow');
  if (children.classList.contains('collapsed')) {
    children.classList.remove('collapsed');
    children.style.maxHeight = children.children.length * 38 + 'px';
    arrow.classList.add('open');
  } else {
    children.classList.add('collapsed');
    children.style.maxHeight = '0';
    arrow.classList.remove('open');
  }
}

function findDoc(id) {
  for (var i = 0; i < knowledgeBase.length; i++) {
    for (var j = 0; j < knowledgeBase[i].children.length; j++) {
      if (knowledgeBase[i].children[j].id === id) return knowledgeBase[i].children[j];
    }
  }
  return null;
}

function loadDoc(id) {
  var doc = findDoc(id);
  if (!doc) return;
  activeDocId = id;
  document.querySelectorAll('.tree-item').forEach(function(i) { i.classList.remove('active'); });
  var activeItem = document.querySelector('[data-doc="' + id + '"]');
  if (activeItem) activeItem.classList.add('active');
  var parentFolder = activeItem ? activeItem.closest('.tree-children') : null;
  if (parentFolder && parentFolder.classList.contains('collapsed')) toggleFolder(parentFolder.dataset.folderChildren);
  breadcrumbCat.textContent = doc.meta.cat;
  breadcrumbDoc.textContent = doc.name;
  docContainer.innerHTML = '<div class="animate-in"><div class="doc-title">' + doc.name + '</div><div class="doc-meta"><span>✍️ ' + doc.meta.author + '</span><span>📅 ' + doc.meta.date + '</span><span>👁 阅读约 ' + Math.max(1, Math.floor(doc.content.length / 800)) + ' 分钟</span></div><div class="doc-body">' + doc.content + '</div></div>';
  if (doc.toc) tocList.innerHTML = doc.toc.map(function(item, i) { return '<a class="toc-item' + (i === 0 ? ' active' : '') + '" href="javascript:void(0)">' + item + '</a>'; }).join('');
  document.getElementById('kbContentScroll').scrollTop = 0;
  renderTree();
}

// ===== SCORE CALCULATION =====
function getMilestoneRate() {
  const items = Object.values(growthState.milestoneItems);
  if (items.length === 0) return 0;
  let sum = 0;
  items.forEach(s => { if (s === 'done') sum += 1; else if (s === 'partial') sum += 0.5; });
  return Math.round((sum / items.length) * 100);
}

function getHardScore() {
  const msRate = getMilestoneRate();
  const compliance = growthState.hardMetrics.compliance_done ? 100 : 0;
  const firstTask = growthState.hardMetrics.first_task_done ? 100 : 0;
  return Math.round((msRate + compliance + firstTask) / 3);
}

function getSoftScore() {
  const comps = growthState.competencies;
  const keys = Object.keys(comps);
  if (keys.length === 0) return 0;
  const avg = keys.reduce((s, k) => s + comps[k], 0) / keys.length;
  return Math.round(avg);
}

function getTotalScore() {
  return Math.round(getHardScore() * 0.4 + getSoftScore() * 0.6);
}

function getGapClass(current, expected) {
  const diff = expected - current;
  if (diff <= 5) return 'small';
  if (diff <= 20) return 'medium';
  return 'big';
}

      <div class="section-title">🎯 阶段对标（点击 ☐ 切换完成状态）</div>
      <div class="section-desc">点击每个检查项的方框循环切换：⬜ 未开始 → 🟡 进行中 → ✅ 已完成</div>
      <div class="milestone-grid" id="milestoneGrid">
        ${milestonesData.map(ms => renderMsCard(ms)).join('')}
      </div>
    </div>

    <!-- 6. Timeline -->
    <div class="timeline-section animate-in delay-5" id="timelineSection">
      <div class="section-title">🛤️ 成长路径</div>
      <div class="timeline">
        ${timelineData.map(tl => `
          <div class="tl-node ${tl.status}">
            <div class="tl-time">${tl.time}</div>
            <div class="tl-title">${tl.title}</div>
            <div class="tl-desc">${tl.desc}</div>
            ${tl.action ? `<div class="tl-action">💡 ${tl.action}</div>` : ''}
          </div>
        `).join('')}
      </div>
    </div>

    <!-- 7. Dynamic Warning -->
    <div class="warning-signals" id="warningSection">
      <h3>🚨 警示信号（基于你的自评自动生成）</h3>
      ${generateWarnings().html}
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid #FDD;font-size:13px;color:var(--text-secondary);">
        <strong>建议行动：</strong>本周五前和直属上级约一次 1:1，对照上面的差距清单逐项确认。<strong style="color:var(--primary);">拖动上方滑块或点击下方方框，警示信号会实时更新。</strong>
      </div>
    </div>`;

  // Attach event listeners
  attachEvents();
}

function renderCompRow(cd) {
  const current = growthState.competencies[cd.key];
  const expected = growthState.expected[cd.key];
  const gap = expected - current;
  const gapClass = getGapClass(current, expected);
  const gapSign = gap > 0 ? '-' : gap < 0 ? '+' : '';
  const nearestLevel = cd.anchors.reduce((prev, curr) =>
    Math.abs(curr.score - current) < Math.abs(prev.score - current) ? curr : prev
  );

  return `
    <div class="rating-row" data-comp="${cd.key}">
      <div class="rr-header">
        <span class="rr-name">${cd.name}</span>
        <div class="rr-scores">
          <span class="rr-current">${current}分</span>
          <span class="rr-sep">/ 期望</span>
          <span class="rr-expected">${expected}分</span>
          <span class="rr-gap ${gapClass}">${gapSign}${Math.abs(gap)} ${gapClass === 'big' ? '🔴' : gapClass === 'medium' ? '🟡' : '🟢'}</span>
          <button class="anchor-toggle-btn" data-toggle="${cd.key}">📋 量表</button>
        </div>
      </div>
      <div class="rr-slider-wrap">
        <input type="range" min="0" max="100" value="${current}" step="5" data-comp="${cd.key}" style="--fill-pct:${current}%">
      </div>
      <div class="rr-ticks">
        ${cd.anchors.map(a => `<span class="${a.score === nearestLevel.score ? 'active' : ''}" data-click-level="${cd.key}:${a.score}">${a.level}<br>${a.score}</span>`).join('')}
      </div>
      <div class="anchor-detail" data-detail="${cd.key}">
        <div class="ad-title">📋 ${cd.name} — 行为锚定量表（当前最接近：<span style="color:var(--primary);">${nearestLevel.level} ${nearestLevel.score}分</span>）</div>
        ${cd.anchors.map(a => `
          <div class="anchor-level${a.score === nearestLevel.score ? ' current' : ''}">
            <span class="al-badge">${a.level} ${a.score}分</span>
            <span>${a.desc}</span>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function renderMsCard(ms) {
  const doneCount = ms.items.filter(it => growthState.milestoneItems[it.id] === 'done').length;
  const partialCount = ms.items.filter(it => growthState.milestoneItems[it.id] === 'partial').length;
  const rate = ms.items.length > 0 ? Math.round((doneCount + partialCount * 0.5) / ms.items.length * 100) : 0;
  return `
    <div class="ms-card">
      <div class="ms-header">
        <div class="ms-day">Day ${ms.day}</div>
        <div class="ms-status ${ms.status}">${ms.label} ${rate}%</div>
      </div>
      <ul class="ms-list">
        ${ms.items.map(item => {
          const state = growthState.milestoneItems[item.id] || 'none';
          const iconMap = { done: '✅', partial: '🟡', none: '⬜' };
          const clsMap = { done: 'checked', partial: 'ms-partial', none: '' };
          return `<li>
            <span class="ms-check ${clsMap[state]}" data-ms="${item.id}">${state === 'done' ? '✓' : state === 'partial' ? '~' : ''}</span>
            ${item.text}
          </li>`;
        }).join('')}
      </ul>
    </div>`;
}

function generateWarnings() {
  var warnings = [];
  var totalGap = 0, maxGap = 0, maxGapName = '', allGood = true;

  compDefs.forEach(function(cd) {
    var current = growthState.competencies[cd.key];
    var expected = growthState.expected[cd.key];
    var gap = expected - current;
    totalGap += gap;
    if (gap > maxGap) { maxGap = gap; maxGapName = cd.name; }

    if (gap >= 35) {
      allGood = false;
      warnings.push({
        level: 'red',
        text: '<strong>🔴 ' + cd.name + '</strong>：差距 <strong>' + gap + '分</strong>（你' + current + ' / 期望' + expected + '）。' +
             '这是当前<strong>最危险的短板</strong>，转正述职中这个维度通常被重点审视。建议本周内制定专项提升计划。'
      });
    } else if (gap >= 20) {
      allGood = false;
      warnings.push({
        level: 'yellow',
        text: '<strong>🟡 ' + cd.name + '</strong>：差距 <strong>' + gap + '分</strong>（你' + current + ' / 期望' + expected + '）。' +
             '虽然不算紧急，但如果不在未来2周内补上，会在贡献期中期检查时被标记。'
      });
    } else if (gap >= 10) {
      warnings.push({
        level: 'yellow',
        text: '<strong>🟡 ' + cd.name + '</strong>：差距 <strong>' + gap + '分</strong>，差距不大但建议关注。调整滑块到期望值，看看总分变化。'
      });
    }
  });

  // Hard metrics check - only show if not done
  if (!growthState.hardMetrics.first_task_done && growthState.daysOnboard > 30) {
    allGood = false;
    warnings.push({
      level: 'red',
      text: '<strong>🔴 首次独立任务未交付</strong>：你已入职' + growthState.daysOnboard + '天，尚未完成首次独立任务。' +
           '距离Day 60中期检查只剩<strong>' + growthState.daysToProbation + '天</strong>，这是转正的硬性门槛。'
    });
  }

  var msRate = getMilestoneRate();
  if (msRate < 70) {
    allGood = false;
    var msDone = Object.values(growthState.milestoneItems).filter(function(s) { return s === 'done'; }).length;
    var msTotal = Object.values(growthState.milestoneItems).length;
    warnings.push({
      level: msRate < 50 ? 'red' : 'yellow',
      text: '<strong>' + (msRate < 50 ? '🔴' : '🟡') + ' 里程碑完成率仅 ' + msRate + '%</strong>（' + msDone + '/' + msTotal + ' 项已完成）。' +
           '点击下方阶段对标卡的方框，如实标记每项的完成状态，这会直接影响硬指标评分。'
    });
  }

  var totalScore = getTotalScore();
  if (totalScore < 50) {
    allGood = false;
    warnings.push({
      level: 'red',
      text: '<strong>🔴 综合评分 ' + totalScore + ' 分</strong>：按当前趋势转正述职<strong>通过概率较低</strong>。' +
           '建议立即约上级做一次正式的差距对齐，不要等到Day 60再行动。'
    });
  }

  if (allGood) {
    var avgSoft = getSoftScore();
    warnings.push({
      level: 'yellow',
      text: '✅ 当前各项指标基本在轨道上。软能力均分 <strong>' + avgSoft + '</strong> 分。' +
           '保持节奏，重点关注<strong>"独立产出"</strong>——它是转正述职中最有说服力的维度。尝试拖动滑块模拟不同场景，看看评分如何变化。'
    });
  }

  return { html: warnings.map(function(w) {
    return '<div class="signal-item"><div class="signal-dot ' + w.level + '"></div><div>' + w.text + '</div></div>';
  }).join(''), count: warnings.length, hasCritical: warnings.some(function(w) { return w.level === 'red'; }) };
}

// ===== EVENT HANDLING =====
function attachEvents() {
  // Slider input
  document.querySelectorAll('#ratingPanel input[type="range"]').forEach(slider => {
    slider.addEventListener('input', function() {
      const key = this.dataset.comp;
      growthState.competencies[key] = parseInt(this.value);
      updateAllDisplays();
    });
  });

  // Tick click
  document.querySelectorAll('.rr-ticks span[data-click-level]').forEach(tick => {
    tick.addEventListener('click', function() {
      const [key, score] = this.dataset.clickLevel.split(':');
      growthState.competencies[key] = parseInt(score);
      updateAllDisplays();
    });
  });

  // Anchor toggle
  document.querySelectorAll('.anchor-toggle-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const key = this.dataset.toggle;
      const detail = document.querySelector(`[data-detail="${key}"]`);
      const isOpen = detail.classList.contains('show');
      // Close all
      document.querySelectorAll('.anchor-detail').forEach(d => d.classList.remove('show'));
      document.querySelectorAll('.anchor-toggle-btn').forEach(b => b.classList.remove('open'));
      if (!isOpen) {
        detail.classList.add('show');
        this.classList.add('open');
      }
    });
  });

  // Hard metric toggles
  document.querySelectorAll('.metric-toggle').forEach(toggle => {
    toggle.addEventListener('click', function(e) {
      if (e.target.tagName === 'BUTTON') {
        const metric = this.dataset.metric;
        growthState.hardMetrics[metric] = e.target.dataset.val === '1';
        renderGrowth();
        document.getElementById('growthScroll').scrollTop = document.getElementById('growthScroll').scrollTop;
      }
    });
  });

  // Milestone checkboxes
  document.querySelectorAll('.ms-check').forEach(check => {
    check.addEventListener('click', function() {
      const id = this.dataset.ms;
      const cycle = { 'none': 'partial', 'partial': 'done', 'done': 'none' };
      growthState.milestoneItems[id] = cycle[growthState.milestoneItems[id]] || 'none';
      updateAllDisplays();
    });
  });
}

function updateAllDisplays() {
  const msRate = getMilestoneRate();
  const hardScore = getHardScore();
  const softScore = getSoftScore();
  const totalScore = getTotalScore();

  // Update score cards
  const hardEl = document.getElementById('hardScoreVal');
  const softEl = document.getElementById('softScoreVal');
  const totalEl = document.getElementById('totalScoreVal');
  if (hardEl) hardEl.textContent = hardScore;
  if (softEl) softEl.textContent = softScore;
  if (totalEl) totalEl.textContent = totalScore;

  // Update score detail
  const detailEl = document.querySelector('.summary-card.sc-hard .sc-detail');
  if (detailEl) detailEl.textContent = `里程碑 ${msRate}% · 合规${growthState.hardMetrics.compliance_done ? '✓' : '✗'} · 首任务${growthState.hardMetrics.first_task_done ? '✓' : '✗'}`;

  // Update each competency row
  compDefs.forEach(cd => {
    const current = growthState.competencies[cd.key];
    const expected = growthState.expected[cd.key];
    const gap = expected - current;
    const gapClass = getGapClass(current, expected);
    const gapSign = gap > 0 ? '-' : gap < 0 ? '+' : '';
    const nearestLevel = cd.anchors.reduce((prev, curr) =>
      Math.abs(curr.score - current) < Math.abs(prev.score - current) ? curr : prev
    );

    const row = document.querySelector(`.rating-row[data-comp="${cd.key}"]`);
    if (!row) return;

    // Update score display
    const currentEl = row.querySelector('.rr-current');
    const gapEl = row.querySelector('.rr-gap');
    if (currentEl) currentEl.textContent = current + '分';
    if (gapEl) {
      gapEl.textContent = `${gapSign}${Math.abs(gap)} ${gapClass === 'big' ? '🔴' : gapClass === 'medium' ? '🟡' : '🟢'}`;
      gapEl.className = 'rr-gap ' + gapClass;
    }

    // Update slider
    const slider = row.querySelector('input[type="range"]');
    if (slider) {
      slider.value = current;
      slider.style.setProperty('--fill-pct', current + '%');
    }

    // Update tick active state
    row.querySelectorAll('.rr-ticks span').forEach(tick => {
      tick.classList.remove('active');
      const tickScore = parseInt(tick.textContent.trim().split('\n').pop());
      if (tickScore === nearestLevel.score) tick.classList.add('active');
    });

    // Update anchor detail current level
    const detail = row.querySelector('.anchor-detail');
    if (detail) {
      const adTitle = detail.querySelector('.ad-title span');
      if (adTitle) adTitle.textContent = `${nearestLevel.level} ${nearestLevel.score}分`;
      detail.querySelectorAll('.anchor-level').forEach(al => {
        al.classList.remove('current');
        const badgeText = al.querySelector('.al-badge').textContent;
        if (badgeText.startsWith(nearestLevel.level)) al.classList.add('current');
      });
    }
  });

  // Update milestone cards
  milestonesData.forEach(ms => {
    ms.items.forEach(item => {
      const state = growthState.milestoneItems[item.id] || 'none';
      const check = document.querySelector(`.ms-check[data-ms="${item.id}"]`);
      if (check) {
        check.className = 'ms-check';
        if (state === 'done') { check.classList.add('checked'); check.textContent = '✓'; }
        else if (state === 'partial') { check.classList.add('ms-partial'); check.textContent = '~'; }
        else { check.textContent = ''; }
      }
    });
    // Update card rate
    const card = document.querySelector(`.ms-card:has([data-ms="${ms.items[0].id}"])`);
    if (card) {
      const doneCount = ms.items.filter(it => growthState.milestoneItems[it.id] === 'done').length;
      const partialCount = ms.items.filter(it => growthState.milestoneItems[it.id] === 'partial').length;
      const rate = ms.items.length > 0 ? Math.round((doneCount + partialCount * 0.5) / ms.items.length * 100) : 0;
      const statusEl = card.querySelector('.ms-status');
      if (statusEl) statusEl.textContent = `${ms.label} ${rate}%`;
    }
  });

  // Update hard metric rows
  const metricRows = document.querySelectorAll('.metric-row');
  if (metricRows.length >= 2) {
    const complianceVal = metricRows[1].querySelector('.metric-val');
    const firstTaskVal = metricRows[2].querySelector('.metric-val');
    if (complianceVal) {
      complianceVal.textContent = growthState.hardMetrics.compliance_done ? '✓ 已完成' : '✗ 未完成';
      complianceVal.style.color = growthState.hardMetrics.compliance_done ? 'var(--success)' : 'var(--danger)';
    }
    if (firstTaskVal) {
      firstTaskVal.textContent = growthState.hardMetrics.first_task_done ? '✓ 已交付' : '✗ 未交付';
      firstTaskVal.style.color = growthState.hardMetrics.first_task_done ? 'var(--success)' : 'var(--danger)';
    }
  }

  // Update warnings
  var warningSection = document.getElementById('warningSection');
  if (warningSection) {
    var sig = generateWarnings();
    var headerText = sig.hasCritical
      ? '🚨 警示信号（' + sig.count + ' 项需关注，含紧急项）'
      : sig.count > 0
        ? '⚠️ 提醒事项（' + sig.count + ' 项建议关注）'
        : '✅ 当前状态良好';
    var html = '<h3 style="color:' + (sig.hasCritical ? 'var(--danger)' : sig.count > 0 ? 'var(--warning)' : 'var(--success)') + ';">' + headerText + '</h3>' + sig.html;
    html += '<div style="margin-top:16px;padding-top:14px;border-top:1px solid #FDD;font-size:13px;color:var(--text-secondary);"><strong>💡 试试：</strong>拖动能力滑块或切换硬指标状态，警示信号和综合评分会<strong style="color:var(--primary);">实时联动更新</strong>。</div>';
    warningSection.innerHTML = html;
    // Flash to indicate auto-update
    warningSection.classList.remove('flash');
    void warningSection.offsetWidth;
    warningSection.classList.add('flash');
  }
}


// ===== View Switching =====
const viewKb = document.getElementById('viewKb');
const viewGrowth = document.getElementById('viewGrowth');
const kbTree = document.getElementById('kbTree');
const growthSidebar = document.getElementById('growthSidebar');
const tocSidebar = document.getElementById('tocSidebar');

document.querySelectorAll('#headerNav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#headerNav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const view = btn.dataset.view;
    if (view === 'kb') {
      viewKb.classList.add('active');
      viewGrowth.classList.remove('active');
      kbTree.style.display = '';
      growthSidebar.style.display = 'none';
      tocSidebar.classList.add('show');
      searchBox.style.display = '';
    } else {
      viewKb.classList.remove('active');
      viewGrowth.classList.add('active');
      kbTree.style.display = 'none';
      growthSidebar.style.display = 'flex';
      tocSidebar.classList.remove('show');
      searchBox.style.display = 'none';
      renderGrowth();
    }
  });
});

// ===== Search =====
const searchClear = document.getElementById('searchClear');
const noResults = document.getElementById('noSearchResults');

searchInput.addEventListener('input', function() {
  var q = this.value.toLowerCase().trim();
  searchClear.style.display = q ? 'flex' : 'none';

  if (!q) { resetSearch(); return; }

  var anyMatch = false;
  document.querySelectorAll('.tree-folder').forEach(function(folder) {
    var folderMatch = false;
    var folderNameEl = folder.querySelector('.folder-name');
    if (folderNameEl && folderNameEl.textContent.toLowerCase().indexOf(q) !== -1) folderMatch = true;

    folder.querySelectorAll('.tree-item').forEach(function(item) {
      var text = item.textContent.toLowerCase();
      var match = text.indexOf(q) !== -1;
      item.style.display = match ? '' : 'none';
      if (match) {
        folderMatch = true;
        // Highlight matching text
        var docNameEl = item.querySelector('.doc-icon');
        if (docNameEl) {
          var parent = item;
          var orig = item.getAttribute('data-orig-text');
          if (!orig) { item.setAttribute('data-orig-text', item.textContent.trim()); }
        }
      }
    });

    if (folderMatch) {
      folder.style.display = '';
      var children = folder.querySelector('.tree-children');
      var header = folder.querySelector('.tree-folder-header');
      if (children && children.classList.contains('collapsed') && header) {
        toggleFolder(header.dataset.folder);
      }
    } else {
      folder.style.display = 'none';
    }
    if (folderMatch) anyMatch = true;
  });

  noResults.style.display = anyMatch ? 'none' : 'block';
  if (!anyMatch) {
    document.getElementById('treeScroll').style.display = 'none';
  } else {
    document.getElementById('treeScroll').style.display = '';
  }
});

function resetSearch() {
  document.querySelectorAll('.tree-item').forEach(function(item) { item.style.display = ''; });
  document.querySelectorAll('.tree-folder').forEach(function(folder) { folder.style.display = ''; });
  noResults.style.display = 'none';
  document.getElementById('treeScroll').style.display = '';
}

searchClear.addEventListener('click', function() {
  searchInput.value = '';
  resetSearch();
  this.style.display = 'none';
  searchInput.focus();
});

// ===== INIT =====
renderTree();
loadDoc('doc-1-1');
</script>

</body>
